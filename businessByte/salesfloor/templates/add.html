{% extends "base.html" %}


{% block title %}
    <title>Neibor | Add a Business</title>
{% endblock title %}

{% block content %}
    <div class="flex w-full justify-center items-center mt-15">
        <div class="card w-full max-w-md shrink-0 shadow-2xl">
            <div class="card-body">
            <fieldset class="fieldset ">

                <form method="POST" action="">

                {% csrf_token %}

                    <h1 class="text-2xl font-bold mb-4" align="center"> Add a Business </h1>


                    <label class="label ml-10 mb-1">Business Name</label>
                    <div class="w-full flex justify-center items-center">
                        <input type="text" class="input"  placeholder="" name="name" />
                    </div>
                    <br>

                    <label class="label ml-10 mb-1">File Upload</label>
                    <div class="w-full flex justify-center items-center">
                        <input type="password" class="input" placeholder="Password" name="password"/>
                    </div>
                    <br>

                    <label class="label ml-10 mb-1">Category</label>
                    <div class="w-full flex justify-center items-center">
                        <input type="password" class="input" placeholder="Password" name="password"/>
                    </div>
                    <br>

                    <label class="label ml-10 mb-1">Description</label>
                    <div class="w-full flex justify-center items-center">
                        <input type="text" class="input"  placeholder="" name="name" />
                    </div>
                    <br>

                    <label class="label ml-10 mb-1">Address</label>
                    <div class="w-full flex justify-center items-center">
                        <input type="password" class="input" placeholder="Password" name="password"/>
                    </div>
                    <br>



                    <button class="btn btn-neutral mt-5 btn-block" type="submit" align="center">Create</button>


                </form>

            </fieldset>
            </div>
        </div>
    </div>
{% endblock content %}
