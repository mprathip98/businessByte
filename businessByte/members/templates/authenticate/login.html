{% extends "base.html" %}

{% block title %}
    <title>Neibor | Login</title>
{% endblock title %}

{% block content %}

    <div class="flex w-full justify-center items-center mt-15">
        <div class="card w-full max-w-sm shrink-0 shadow-2xl">
            <div class="card-body">
            <fieldset class="fieldset ">

                <form method="POST" action=""></form>
                {% csrf_token %}

                    <div class="w-full flex justify-center items-center">
                        <h1 class="text-2xl font-bold mb-2"> Sign In </h1>
                    </div>

                    <label class="label ml-2">Username</label>
                    <div class="w-full flex justify-center items-center">
                        <input class="input mb-2" type="text" placeholder="John123" name="username">
                    </div>

                    <label class="label ml-2">Password</label>
                    <div class="w-full flex justify-center items-center">
                        <input class="input mb-2" type="password" name="password">
                    </div>


                    <button class="btn btn-neutral mt-6 btn-block" type="submit" align="center">Login</button>
                    <div class="w-full flex justify-center items-center">
                        <a href="{% url 'register' %}" class="mt-2">Don't have an account?</a>
                    </div>
                </form>

            </fieldset>
            </div>
        </div>
    </div>


{% endblock content %}
